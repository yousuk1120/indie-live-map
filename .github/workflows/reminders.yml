name: ticket-open reminders

# 예매 오픈 "약 1시간 전" 정밀 알림을 위해 리마인더 크론 엔드포인트를 자주 호출합니다.
# Vercel Hobby 크론은 하루 1회라 분 단위 정밀 알림이 불가 → GitHub Actions 로 보완(무료).
#
# ⚙️ 설정 필요 (Repo → Settings → Secrets and variables → Actions → New repository secret):
#   SITE_URL     프로덕션 주소, 예: https://your-domain.com  (끝 슬래시 없이)
#   CRON_SECRET  Vercel 환경변수 CRON_SECRET 와 동일한 값
# 설정 전에는 아래 job 이 "건너뜀"으로 조용히 끝납니다(실패 알림 없음).
#
# ⚠️ GitHub 는 저장소가 60일간 활동이 없으면 예약 워크플로를 자동 비활성화합니다.

on:
  schedule:
    - cron: "*/30 * * * *" # 30분마다 (티켓오픈 1시간 전 윈도우를 안정적으로 포착)
  workflow_dispatch: {} # 수동 실행 버튼

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminders cron
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SITE_URL/CRON_SECRET 미설정 — 건너뜀 (Secrets 설정 후 동작)"
            exit 0
          fi
          curl -fsS -m 60 -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/reminders"
