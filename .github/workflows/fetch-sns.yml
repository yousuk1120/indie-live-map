name: fetch-sns collection

# 인스타 수집 크론을 하루 여러 번 호출해 공연을 더 자주/많이 올립니다.
# Vercel Hobby 크론은 하루 1회라 300초 안에 70개 계정을 다 못 돌아(절반이 2~3일 방치),
# 새 공연이 늦게·적게 올라오던 문제를 GitHub Actions 로 보완합니다(무료).
# fetch-sns 는 lastFetchedAt 오래된 계정부터 처리하므로, 자주 호출할수록 방치 계정이 빨리 갱신됩니다.
#
# ⚙️ 설정 (reminders.yml 과 동일한 Secrets 를 공유 — 이미 설정돼 있으면 추가 작업 불필요):
#   SITE_URL     프로덕션 주소 (끝 슬래시 없이)
#   CRON_SECRET  Vercel 환경변수 CRON_SECRET 와 동일한 값
# 설정 전에는 조용히 건너뜁니다(실패 알림 없음).
#
# ⚠️ GitHub 는 저장소가 60일간 활동이 없으면 예약 워크플로를 자동 비활성화합니다.
# 💰 호출 1회당 Apify 스크랩 비용이 듭니다. 비용을 줄이려면 아래 cron 간격을 늘리세요(예: 0 */12 * * *).

on:
  schedule:
    - cron: "0 */6 * * *" # 6시간마다 (Vercel 일 1회 + 이거 4회 = 하루 ~5패스, 70계정 전부 반복 커버)
  workflow_dispatch: {} # 수동 실행 버튼

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger fetch-sns cron
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SITE_URL/CRON_SECRET 미설정 — 건너뜀 (Secrets 설정 후 동작)"
            exit 0
          fi
          # fetch-sns 는 maxDuration 300초 → 서버 완료까지 대기(타임아웃이어도 서버는 계속 실행될 수 있음)
          curl -fsS -m 310 -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/fetch-sns" \
            || echo "요청이 타임아웃/실패했지만 서버 수집은 계속 진행될 수 있습니다."
